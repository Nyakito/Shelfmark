<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shelfmark — My Shelf</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to saved books</a>
    <header class="masthead">
      <a class="logo" href="index.html">SHELFMARK</a>
      <nav aria-label="Primary">
        <a href="index.html">Discover</a
        ><a class="active" href="saved.html"
          >My Shelf <span id="saved-count">0</span></a
        >
      </nav>
    </header>
    <main id="main">
      <header class="shelf-head">
        <p class="edition">PERSONAL INDEX</p>
        <h1>My shelf.</h1>
      </header>
      <section id="saved-list" class="saved-list" aria-live="polite">
        <article class="empty-card">
          <h2>Your shelf is waiting.</h2>
          <p>Saved books would gather here in a learner-built collection.</p>
          <a href="index.html">Browse the stacks →</a>
        </article>
      </section>
    </main>
    <footer>
      <a href="index.html">Shelfmark</a>
      <p>Open Library learning scaffold</p>
    </footer>
    <script type="module" src="js/saved.js"></script>
  </body>
</html>
